body{background-image:linear-gradient(rgba(12,13,25,.84),rgba(12,13,25,.92)),var(--league-art);background-size:cover;background-position:center top;background-attachment:fixed}
.sidebar{background:rgba(18,19,34,.95);border-color:#414155}.moon-mark{background:#f2d9d3;box-shadow:0 0 28px #b7191930}.moon-mark:after{background:#121322}
.topbar{background:rgba(18,19,34,.8);backdrop-filter:blur(12px)}.nav-label{color:#b6a1b0}.nav-btn{color:#d1c6d0}.nav-btn.active{background:#55252d;color:#ffd6cd}.nav-btn:hover{background:#342839}
.hero{padding:0;background-color:#171827;background-image:var(--league-art);background-size:contain;background-position:center;background-repeat:no-repeat;aspect-ratio:2048/853;min-height:0;border-color:#62516a;border-radius:12px}
.hero:after,.hero-copy,.hero-moon{display:none}
.panel,.stat,.match-card,.player-card{background:rgba(27,29,47,.95)}.panel{border-color:#414155}.stat-head,.stat-foot,.note,.subtitle{color:var(--muted)}.stat-head svg{color:#d1a3ad}.stat-foot span{color:var(--accent)}
.btn{background:#29283d;border-color:#514454}.btn:hover{background:#3c3045}.btn.primary{background:#b72e3a;color:white;border-color:#cf4954}.btn.primary:hover{background:#d33a45}
.tabs{background:#151626;border-color:#454051}.tabs button.active{background:#562a36;color:#ffd5ce}.avatar,.initial{background:#463040;color:#f5d0ca}
th{background:#25253b;color:#c6bdcd}td{border-color:#39364a}tbody tr:hover{background:#302b40}.rank{color:#afa7bb}.rank.top{color:#ffc3b8}
.badge{background:#4a2f3d;border-color:#725066;color:#f0d0da}.badge.muted{background:#303043;border-color:#4c4b60;color:#bbb5c8}.badge.good{background:#303d48;border-color:#4d6576;color:#c5dce9}
.note-block{background:#2a263c;border-color:#514356}.storage-card{border-color:#4a3e50}.rule-line,.match-brief{border-color:#3f394b}.rule-line{color:#d2c5d3}
input,select,textarea{background:#151625;border-color:#54485c}.formula{background:#2e2435}.footer{color:#b1a5b6}.status{color:#c7bccb}.table-foot{color:#bbb1c1}
@media(max-width:520px){.hero{aspect-ratio:2048/853;min-height:0;padding:0;border-radius:7px}.content{padding-top:24px}body{background-attachment:scroll}}
/* 固定板型配置 */
.field-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.board-config{display:grid;gap:9px;margin:0 0 18px;padding:14px 16px;border:1px solid #514356;border-radius:8px;background:#221f33}
.board-config .note{margin:0}
.board-config-head{display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.board-config-head b{color:var(--text);font-weight:600}
.board-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px}
.board-group>span:first-child{color:var(--muted);min-width:52px}
.role-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;border:1px solid #4c4b60;background:#2b2a40;color:#d8d0de}
.role-chip .num{color:var(--muted)}
.role-chip.wolf{border-color:#6a4552;background:#3a2731;color:#f0c7c0}
.role-chip.full{border-color:#4d6576;background:#283646;color:#c5dce9}
.role-chip.full .num{color:#c5dce9}
.role-chip.over{border-color:#a2504c;background:#3d2324;color:var(--red)}
.editor-table .seat-role{min-width:132px}
.editor-table select:disabled{opacity:.75;cursor:default}
.board-line{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted);line-height:1.7;margin:8px 0 2px!important}
.board-line b{color:#d2c5d3;font-weight:500;margin-right:6px}
/* 不能投自己 */
.vote-candidate.is-self{cursor:not-allowed;opacity:.6}
.self-tag{display:inline-flex;margin-left:8px;font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid #4c4b60;background:#303043;color:#bbb5c8;vertical-align:1px}
/* 管理者投票明細 */
.ballot-log{margin-top:20px;border:1px solid #514356;border-radius:8px;background:#221f33}
.ballot-log summary{cursor:pointer;padding:12px 14px;font-size:13px;color:var(--accent)}
.ballot-log summary .muted{font-size:11px}
.ballot-log .note{padding:0 14px 14px;margin:0!important}
.ballot-log table{font-size:11px}
.ballot-log th,.ballot-log td{padding:9px 12px;white-space:normal;vertical-align:top}
.ballot-log th:first-child,.ballot-log td:first-child{padding-left:14px}
.ballot-picks{line-height:1.6}.ballot-picks>span{display:inline-block;white-space:nowrap;margin-right:10px}
.ballot-who{min-width:110px;width:48%}
.ballot-who b{display:block;font-weight:500;color:var(--text)}
.ballot-who small{display:block;color:var(--muted);font-size:10px;margin-top:2px;overflow-wrap:anywhere}
/* 重設對局 */
dialog:has(#reset-form){max-width:600px}
.reset-list{margin:0 0 18px;padding-left:20px;font-size:12px;line-height:1.9;color:#d2c5d3}
.reset-list li{margin:6px 0}
.reset-list b{color:#ffd5ce;font-weight:600}
/* 上帝投票（只有上帝與管理者看得到） */
.god-tag{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid #6b5434;background:#3a2f22;color:#f3d29b;white-space:nowrap;vertical-align:1px}
.god-vote{margin-top:20px;padding:16px;border:1px solid #6b5434;border-radius:8px;background:#28221f}
.god-vote h3{color:#f3d29b;font-size:14px;font-weight:600;margin-bottom:6px}
.god-vote .note{margin:0!important}
.god-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 14px}
.god-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #4c4b60;border-radius:6px;font-size:12px;cursor:pointer;min-width:0}
.god-chip span{overflow-wrap:anywhere}
.god-chip input{accent-color:#e3b467;flex-shrink:0}
.god-chip:has(input:checked){border-color:#c99d5a;background:#3a2f22}
.god-vote .btn.primary{background:#a8792f;border-color:#c99d5a}
.god-vote .btn.primary:hover{background:#bf8b38}
.ballot-log .god-row td{background:#2a2420}
@media(max-width:520px){.god-picks{grid-template-columns:1fr}}
/* 後台上帝票 */
.editor-table .seat-god{width:56px}
.editor-table .seat-god input{width:16px;height:16px;accent-color:#e3b467}
@media(max-width:800px){.field-row.three{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.field-row.three{grid-template-columns:1fr}}

window.DARKMOON_RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() {\n      return request.auth != null;\n    }\n    function admin() {\n      return signedIn()\n        && exists(/databases/$(database)/documents/admins/$(request.auth.uid))\n        && get(/databases/$(database)/documents/admins/$(request.auth.uid)).data.enabled == true;\n    }\n    function validRecord() {\n      let record = request.resource.data;\n      return record.keys().hasAll(['payload', 'revision', 'updatedAt', 'updatedBy'])\n        && record.keys().hasOnly(['payload', 'revision', 'updatedAt', 'updatedBy'])\n        && record.payload is string\n        && record.payload.size() > 0\n        && record.payload.size() \u003c= 800000\n        && record.revision is int\n        && record.revision >= 1\n        && record.updatedAt == request.time\n        && record.updatedBy == request.auth.uid;\n    }\n    match /admins/{uid} {\n      allow get: if signedIn() && request.auth.uid == uid;\n      allow list, create, update, delete: if false;\n    }\n    match /leagues/{leagueId} {\n      // 公開讀取：未登入的訪客也能看到最新排名。\n      // 若只想讓登入帳號讀取，把下一行改成：allow get: if signedIn();\n      allow get: if true;\n      allow list: if false;\n      allow create: if admin() && validRecord() && request.resource.data.revision == 1;\n      allow update: if admin() && validRecord()\n        && request.resource.data.revision == resource.data.revision + 1;\n      allow delete: if false;\n    }\n    // 進行中對局的角色與陣營：只有管理員能讀寫，比賽標記完成後才併回公開資料。\n    match /leagueSecrets/{leagueId} {\n      allow get: if admin();\n      allow list, delete: if false;\n      allow create, update: if admin() && validRecord();\n    }\n    match /voting/{leagueId} {\n      allow read: if true;\n      allow write: if admin();\n      match /polls/{pollId} {\n        function ballotPath(id) {\n          return /databases/$(database)/documents/voting/$(leagueId)/polls/$(pollId)/ballots/$(id);\n        }\n        function godPath() {\n          return /databases/$(database)/documents/voting/$(leagueId)/polls/$(pollId)/secret/god;\n        }\n        function newGodUid() {\n          return request.resource.data.get('godUid', '');\n        }\n        allow read: if true;\n        allow create: if admin() && request.resource.data.status == 'open'\n          && request.resource.data.candidateIds is list\n          && request.resource.data.candidateIds.size() > 0\n          && request.resource.data.candidateIds.size() \u003c= 12\n          && newGodUid() is string\n          && request.resource.data.get('seatUids', {}) is map;\n        // 結束投票：只能由開放改為結束，結束後不可重開。\n        allow update: if admin() && resource.data.status == 'open'\n          && request.resource.data.status == 'closed'\n          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status', 'closedAt']);\n        // 開賽後仍可更換板子、本場上帝與座位帳號對照；座位名單（候選人）不能修改。\n        // 上帝投過票後不能再換上帝；已經投過玩家票的帳號不能改成本場上帝。\n        allow update: if admin()\n          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['board', 'godUid', 'seatUids'])\n          && request.resource.data.get('board', '') is string\n          && newGodUid() is string\n          && request.resource.data.get('seatUids', {}) is map\n          && (!request.resource.data.diff(resource.data).affectedKeys().hasAny(['godUid'])\n            || (!exists(godPath())\n              && (newGodUid() == '' || !exists(ballotPath(newGodUid())))));\n        // 重設對局：管理者可刪除投票文件（連同下方的選票與投票者紀錄），之後同一場可以重新開啟。\n        allow delete: if admin();\n        match /ballots/{uid} {\n          function poll() {\n            return get(/databases/$(database)/documents/voting/$(leagueId)/polls/$(pollId)).data;\n          }\n          allow read: if true;\n          // 玩家票：每個帳號每場一張，1～3 位不同的本場玩家。\n          // 本場上帝不投玩家票；座位上已綁定帳號的玩家不能投給自己。\n          allow create: if signedIn() && request.auth.uid == uid\n            && poll().status == 'open'\n            && request.auth.uid != poll().get('godUid', '')\n            && request.resource.data.keys().hasOnly(['playerIds', 'createdAt'])\n            && request.resource.data.playerIds is list\n            && request.resource.data.playerIds.size() >= 1\n            && request.resource.data.playerIds.size() \u003c= 3\n            && request.resource.data.playerIds.toSet().size() == request.resource.data.playerIds.size()\n            && poll().candidateIds.hasAll(request.resource.data.playerIds)\n            && !request.resource.data.playerIds.hasAny([poll().get('seatUids', {}).get(request.auth.uid, '')])\n            && request.resource.data.createdAt == request.time;\n          allow update: if false;\n          allow delete: if admin();\n        }\n        // 上帝票：每場一張（secret/god），不公開；只有本場上帝與管理者讀得到。\n        // 由本場上帝的帳號或管理者送出，1～3 位不同的本場玩家。\n        match /secret/{docId} {\n          function poll() {\n            return get(/databases/$(database)/documents/voting/$(leagueId)/polls/$(pollId)).data;\n          }\n          function isGod() {\n            return signedIn() && request.auth.uid == poll().get('godUid', '');\n          }\n          allow get: if docId == 'god' && (admin() || isGod());\n          allow list: if admin();\n          allow create: if docId == 'god' && signedIn()\n            && poll().status == 'open'\n            && (isGod() || admin())\n            && request.resource.data.keys().hasOnly(['playerIds', 'castBy', 'createdAt'])\n            && request.resource.data.playerIds is list\n            && request.resource.data.playerIds.size() >= 1\n            && request.resource.data.playerIds.size() \u003c= 3\n            && request.resource.data.playerIds.toSet().size() == request.resource.data.playerIds.size()\n            && poll().candidateIds.hasAll(request.resource.data.playerIds)\n            && request.resource.data.castBy == request.auth.uid\n            && request.resource.data.createdAt == request.time;\n          allow update: if false;\n          allow delete: if admin();\n        }\n        // 投票者 Email：只有管理者讀得到，用來在投票明細顯示未綁定帳號是誰。\n        match /voters/{uid} {\n          allow get, list: if admin();\n          allow create: if signedIn() && request.auth.uid == uid\n            && request.resource.data.keys().hasOnly(['email', 'createdAt'])\n            && request.resource.data.email == request.auth.token.email\n            && request.resource.data.createdAt == request.time;\n          allow update: if false;\n          allow delete: if admin();\n        }\n      }\n    }\n    match /{document=**} {\n      allow read, write: if false;\n    }\n  }\n}\n";
window.DARKMOON_GUIDE="# 連接 Firebase\n\n## 這一版的更新：上帝投票恢復，且不公開（請重新發布安全規則）\n\n- **上帝在投票頁投票，但不公開**：本場上帝（對局編輯的「本場上帝」）登入後會自動進投票頁，看到只有自己看得到的「上帝投票」區，可投 1～3 位不同玩家，送出後不能更改。未指定上帝、或上帝沒有綁定帳號時，由管理者在投票頁代投。\n  - 上帝票存在 `voting/{聯賽ID}/polls/{場次ID}/secret/god`，只有本場上帝與管理者讀得到；公開票數、票數條、其他參與者的畫面都不會出現上帝票。\n  - 管理者的「投票明細」最上面會列出上帝票（含是否為管理者代投）。\n  - 對局編輯按「帶入投票票數」時，會把上帝的選擇勾到「上帝票」欄並加進 MVP 票（每票 +0.25 分）。上帝沒投時，也可以直接在「上帝票」欄手動勾選（最多 3 位）。勾選結果只存在管理員專用的 `leagueSecrets`。\n  - 上帝不投玩家票；上帝投過票後就不能再更換本場上帝。\n- **重設對局**也會一併刪除上帝票。\n- **必須重新發布 `firestore.rules`**：本版規則包含不公開的上帝票、不能投自己、管理者投票明細與重設對局。未發布前上帝送票會被拒絕，管理者畫面會提示讀不到上帝票。\n\n## 上一版的更新：重設對局\n\n- **重設對局**：對局編輯視窗左下角、投票頁每場的按鈕列都有「重設對局」。重設會：\n  - 有開過投票的場次：先結束投票，再刪除本場全部選票、投票明細與投票文件（無法復原），之後可以再按「開啟比賽」重新投票，場上玩家登入時也會再被帶到投票頁。\n  - 清除勝方、MVP 票、上帝票、違規與基本分，紀錄狀態改回草稿；已完成的場次會從積分排名移除，直到再次標記完成。\n  - 預設保留板子、座位、角色與本場上帝；勾選「同時清空座位、角色與本場上帝」則只保留板子。\n\n## 更早的更新：不能投自己、管理者投票明細\n\n- **不能投自己**：投票頁會把自己的名字標成「你自己」並停用。開啟比賽時，系統把座位玩家的帳號對照（`seatUids`）存進投票文件，安全規則會拒絕投給自己的選票。座位上尚未綁定帳號的玩家，系統無法辨認是誰，開賽時會提醒。開賽後才綁定帳號的玩家，儲存一次該場對局即可補上對照。\n- **管理者看得到誰投誰**：管理者在投票頁每場下方會看到「投票明細」，列出每張票的投票者、投給誰、投票時間。已綁定的帳號顯示玩家姓名；未綁定的帳號顯示 Email（投票時另存在只有管理者能讀的 `voting/{聯賽ID}/polls/{場次ID}/voters`）。其他參與者的畫面不會顯示明細。\n\n## 更早的更新：固定板型、開賽後改板子\n\n- **14 個固定板型**：對局編輯的「比賽板子」改為下拉選單，內容依《積分賽板型配置 · 12 人局》：預女獵白混、狼王魔術師、狼美人騎士、機械狼通靈師、石像鬼守墓人、夢魘攝夢人、血月使者獵魔人、大灰狼占卜師、尋香識命、時波之亂、奇商覺醒狼王、狼兄弟黑商、迷霧鴉影、永序之輪。選好板子後，每個座位的角色只能從該板型配置中挑選，名額用完的角色會變灰；陣營依配置自動帶入，只有混血兒要依榜樣自己選。視窗上方會即時顯示「已分配角色 x／12」與各角色名額。\n- **換板子**：換成另一個板型時，新板型裡還有名額的角色會保留，其餘角色清空並提示重新分配。舊紀錄裡的「狼人」「小狼」會自動對應為「普通狼人」，「白癡」對應為「白痴」。\n- **開賽後仍可改板子與身分**：已按「開啟比賽」的場次，仍可修改板子、角色、陣營與本場上帝；只有座位與玩家（也就是投票名單）鎖定。儲存後投票頁的板子會同步更新。投票頁每場也多了「修改板子／上帝」按鈕，直接打開該場的編輯視窗。\n- **MVP 票數上限改為 99**：玩家票加上帝票可能超過 12，原本的 12 票上限會讓這種場次存不進去。\n\n## 最初幾版的更新\n\n- **未登入也能看最新排名**：新版 `firestore.rules` 把 `leagues/{聯賽ID}` 改為公開讀取。到 Firebase Console 的「Firestore Database → Rules」貼上新版規則並按 Publish 後，訪客不用登入就會看到雲端的最新排名；登入只用於投票與管理。尚未發布新規則前，網頁行為與舊版相同（未登入者看到網頁內建的紀錄）。\n- 公開讀取的內容包含玩家姓名與已完成對局的角色、成績；尚未完成的對局不含角色與陣營。\n- **進行中的身分不公開**：對局在標記「已完成」之前，角色與陣營改存在只有管理員能讀的 `leagueSecrets/{聯賽ID}`，公開的聯賽資料裡是空白；管理者畫面照常顯示。標記完成並儲存後，角色才會寫進公開資料。**需發布新版規則才會生效**；未發布時會沿用舊的單一文件存法，身分仍在公開資料裡。\n- **場上玩家自動進投票頁**：比賽開啟後，帳號已綁定且在該場座位上的玩家登入（或正開著網頁）會直接跳到「MVP 投票」；投票頁只顯示座位與姓名，不顯示角色或陣營。未綁定或不在場上的帳號不會自動跳轉。\n- **MVP 每人 1～3 票**：投票頁改為複選，每個帳號每場最少選 1 位、最多選 3 位不同玩家。**必須發布新版 `firestore.rules`**，否則送出投票會被舊規則拒絕。\n- **自行註冊**：登入視窗新增「還沒有帳號？註冊新帳號」，註冊後直接登入並可投票。新帳號沒有管理權限。\n- **編輯玩家可設定 Email 與個人預設密碼**：管理者在「玩家名單 → 編輯資料」填入 Email 與該玩家的預設密碼並儲存，會自動建立帳號並綁定。這兩欄存在管理員專用的 `leagueSecrets` 文件，不在公開資料與 JSON 備份內。預設密碼只是初始密碼，玩家登入後可在「帳號 → 更改密碼」自行更換；忘記時可在登入視窗按「忘記密碼？」，或由管理員在同一個視窗按「寄送重設密碼信」，用 Email 重新設定。網頁無法直接改寫別人的密碼（需要伺服器端的 Admin SDK）。\n- **預設帳號**：管理者在「玩家名單」按「預設帳號」，每行貼上 `姓名,Email`（或 `姓名,Email,密碼`）並填預設密碼，即可一次建立帳號並綁定到玩家。Email 與密碼只送到 Firebase Authentication，聯賽資料只存綁定的帳號 UID。綁定後玩家登入會看到自己的名字，並可在「帳號」查看個人成績與更改密碼。此功能需要 Authentication 允許建立帳號（預設開啟）。\n- **忘記密碼**：登入視窗填入 Email 後按「忘記密碼？」，Firebase 會寄出重設密碼信。信件範本可在「Authentication → Templates」調整語言與寄件名稱。\n- **帶入投票票數**：已開過投票的場次，在編輯對局視窗按「帶入投票票數」，會把每位玩家的得票數填進 MVP 票欄，確認後再儲存。\n- 參與者現在也能點玩家姓名查看個人各場得分，並閱讀「計分規則」頁。\n- 本機管理帳號連續輸入錯誤 5 次後會暫時鎖定（僅限該瀏覽器，屬於減緩猜測的措施）。\n\n## 開啟比賽與 MVP 投票\n\n請先發布這次更新的 `firestore.rules`，否則投票資料會被原本規則拒絕。管理者在「對局紀錄」選擇板子，設定座位、姓名、身分、陣營與本場上帝，儲存後按「開啟比賽」。同一聯賽同時只能開啟一場投票。開啟後鎖定座位與玩家（投票名單）；板子、身分、陣營與本場上帝仍可修改，也可輸入勝方和成績。\n\n參與者在有開放比賽時登入，會自動跳到「MVP 投票」。每個 Firebase 帳號每場可投 1～3 票（須投給不同玩家），一次送出後不可更改。不能投給自己。本場上帝不投玩家票，改投一張不公開的上帝票（1～3 位不同玩家，由上帝本人或管理者送出）；管理者帶入票數時才與玩家票合併計分，投票頁不顯示。投票對象必須是該場玩家；管理者可在投票頁按「結束投票」，結束後禁止新增票。要整場重來時按「重設對局」：會刪除該場投票與選票，之後可以重新「開啟比賽」。管理者帳號也可投票；目前不限投票者必須在當場座位中。\n\n公開資料位於 `voting/{聯賽ID}/polls/{場次ID}` 及其 `ballots` 子集合；投票者的 Email 存在只有管理者能讀的 `voters` 子集合，管理者在投票頁的「投票明細」可看到誰投給誰。只要載入同一 Firebase 設定，即使未登入也能查看所有已開放場次的玩家座位、板子、逐人票數及總票數。公開名單不含角色／陣營；公開的選票不存 Email 或投票者姓名，票券文件 ID 使用帳號 UID 以防重複。注意：玩家名單的帳號 UID 也在公開資料裡，懂 Firebase 的人技術上仍能比對出已綁定玩家投給誰；網頁畫面只對管理者顯示明細。公開可讀的聯賽資料只包含已完成對局的角色；進行中對局的角色存在管理員專用文件。\n\n投票紀錄獨立保存，不會被聯賽 JSON 還原覆蓋，亦不會自動覆蓋成績表內的 MVP 欄位。結束後在編輯對局視窗按「帶入投票票數」即可填入該場成績。投票資料可由 Firebase Console 備份。此流程已用 SDK 替身完成瀏覽器測試，實際專案及安全規則仍須部署後驗證。\n\n目前未綁定 Firebase 專案。未連線時預設以參與者身分唯讀顯示本機資料；登入本機管理帳號後可編輯。設定 Firebase 後，可使用登入帳號讀取雲端聯賽；管理者可以管理完整資料，參與者顯示「賽季總覽」、「積分排名」與「MVP 投票」。\n\n第一次設定：點右上角「登入」，展開「首次設定 Firebase」貼上公開設定，再登入帳號。管理者資格由 `admins/{uid}` 的 `enabled: true` 決定；無此資格的帳號不會顯示管理頁、編輯、匯出或備份入口。登出或權限撤銷會立即關閉管理頁面及管理表單。\n\n交付的 HTML 內嵌原始名單與成績。Firebase 登入管控雲端讀寫；若公開部署，HTML 內的初始資料也會隨網頁提供。設定頁的「下載已套用設定的 HTML」只加入公開連線設定，日後資料變更由登入後的雲端聯賽讀取。\n\n## 1. 建立專案與網頁應用程式\n\n1. 開啟 [Firebase 控制台](https://console.firebase.google.com/)，建立專案。\n2. 在「專案設定 → 一般」新增網頁應用程式（`\u003c/>`）。\n3. 複製 `firebaseConfig` 物件的公開設定。網頁設定入口需要 `apiKey`、`authDomain`、`projectId`、`appId`。也可包含 `storageBucket`、`messagingSenderId` 等欄位。\n4. 在右上角「登入 → 首次設定 Firebase」填入設定，已有管理者權限後也能從「雲端與備份」管理連線。不要貼服務帳戶 JSON、`private_key` 或 Admin SDK 私鑰。公開設定的用途是識別專案，資料權限由 Authentication 與 Firestore 規則控制。\n\n設定物件範例（請換成控制台實際數值）：\n\n```json\n{\n  \"apiKey\": \"YOUR_WEB_API_KEY\",\n  \"authDomain\": \"YOUR_PROJECT_ID.firebaseapp.com\",\n  \"projectId\": \"YOUR_PROJECT_ID\",\n  \"appId\": \"YOUR_WEB_APP_ID\"\n}\n```\n\n## 2. 啟用登入並建立帳號\n\n1. 開啟「Build → Authentication → Sign-in method」。\n2. 啟用「Email/Password」的電子郵件與密碼登入方式。\n3. 到「Users」按「Add user」，建立管理員的電子郵件與密碼，複製該帳號的 UID。\n4. 在 Authentication 設定的「Authorized domains」加入實際部署網域；本機測試若需要，加入 `localhost`。請填網域本身，不含 `https://` 或路徑。\n\n參與者可在登入視窗展開「還沒有帳號？註冊新帳號」自行註冊，也可由管理者在控制台建立帳號；忘記密碼可由「忘記密碼？」自行重設。自行註冊不驗證 Email，同一人可用多個信箱註冊並重複投票；帶入票數前，可到「Authentication → Users」檢查可疑帳號並停用。要關閉自行註冊，到「Authentication → Settings → User actions」取消勾選「Enable create (sign-up)」。\n\n## 3. 建立 Firestore 與管理員資格\n\n1. 開啟「Build → Firestore Database」，建立預設 `(default)` 資料庫，選擇 Standard edition 與適當地區。\n2. 使用正式模式建立，將本資料夾的 `firestore.rules` 全文貼到「Rules」並按 Publish。\n3. 到「Data」新增集合 `admins`。\n4. 文件 ID 填入剛才複製的管理員 UID。\n5. 新增欄位 `enabled`，型別選 **boolean**，數值設為 **true**。\n\n管理員資格只能由控制台或受信任的管理工具維護。網頁無法自行授予管理員權限。取消管理員資格時，將 `enabled` 改為 `false`，正在開啟的網頁會停止允許編輯。\n\n規則允許任何人讀取聯賽排名，只有啟用的管理員可寫入；不允許從網頁刪除整份聯賽。不要使用 `allow read, write: if true` 的測試規則。\n\n## 4. 第一次匯入\n\n1. 在網頁連接 Firebase，使用管理員帳號登入。\n2. 等待雲端讀取完成。若該聯賽 ID 還沒有資料，使用匯入本機資料的操作。\n3. 匯入只會建立空的雲端聯賽，不會覆蓋已存在的資料。其他裝置填入相同的專案設定與聯賽 ID、登入後，即可讀取同一份資料。\n4. 之後每次儲存使用 Firestore transaction 比對版本。其他人先修改時，舊版本的儲存會被拒絕，請重新檢查最新資料後再編輯。\n\nFirestore 路徑為 `leagues/{聯賽ID}`，預設 ID 是 `darkmoon`。資料存為 JSON 字串 `payload`，並包含遞增的 `revision`、`updatedAt` 和 `updatedBy`。此版本每份聯賽上限為 800,000 UTF-8 bytes，適合本次 Excel 規模。JSON 內部欄位由網頁驗證；Firestore 規則驗證外層格式與管理員資格。請只把可信任的維護人員設為管理員。\n\n## 5. 使用 Firebase Hosting（可選）\n\n網頁可放在一般靜態網站主機，資料仍使用 Firebase。若要一起放在 Firebase Hosting，在此專案資料夾執行：\n\n```powershell\nnpm install -g firebase-tools\nfirebase login\nfirebase deploy --project YOUR_PROJECT_ID --only firestore:rules,hosting\n```\n\n`firebase.json` 已將網站目錄設為 `dist`，不需另行執行 `firebase init`。先將 `YOUR_PROJECT_ID` 換成真實 ID。這個指令會發布本專案的規則及網站。\n\n如只要發布安全規則：\n\n```powershell\nfirebase deploy --project YOUR_PROJECT_ID --only firestore:rules\n```\n\n## 驗證連線\n\n- 以管理員登入後，確認可匯入與儲存，重新整理仍能取得資料。\n- 用另一個瀏覽器登入相同專案與聯賽，確認修改會同步。\n- 用未加入 `admins` 的帳號登入，確認只能查看。\n- 登出後重新整理，確認未登入也能看到雲端的最新排名（需已發布新版規則）。\n- 兩個視窗同時編輯，第二個視窗儲存舊版本時應收到版本衝突訊息。\n- 中斷網路時，畫面應顯示斷線或等待雲端確認，不應顯示新的儲存成功訊息。\n\n目前因尚未建立實際 Firebase 專案，未執行真實專案的登入、權限、同步端到端驗證。完成設定後應執行上述驗證。\n\n官方文件：[網頁 SDK 設定](https://firebase.google.com/docs/web/alt-setup)、[密碼登入](https://firebase.google.com/docs/auth/web/password-auth)、[即時監聽](https://firebase.google.com/docs/firestore/query-data/listen)、[交易與版本檢查](https://firebase.google.com/docs/firestore/manage-data/transactions)、[Firestore 安全規則](https://firebase.google.com/docs/firestore/security/get-started)。\n\n## 指定的本機管理帳號\n\n右上角「登入」可使用帳號 `ntnuwsc` 與使用者指定的密碼。密碼以 PBKDF2-SHA256 驗證值儲存，HTML 不含明文密碼。登入後可編輯本機對局、玩家和備份，登出或重新載入後須重新登入。\n\n此帳號只控制本機介面，不是 Firebase Authentication 帳號，也不提供伺服器端存取保護。開放跨裝置比賽及投票仍須設定 Firebase、建立真正的管理帳號與 admins 授權。公開部署時請使用 Firebase 的安全規則管理雲端權限。\n\n背景使用使用者提供的 CANVA.png 原圖，已內嵌到單一 HTML；不需另外攜帶圖片檔。\n";
const localAdminModule=(()=>{
// This account unlocks local editing only. Firebase still requires server-granted authority.
const VERIFY_HASH='2db70e4cefb8f128f79bb25f1f6b4c4f1a6223466225fc4ba7336a3c12e1b2e5';
async function verifyLocalAdmin(username,password){
 if(username!=='ntnuwsc'||typeof password!=='string')return false;
 if(!globalThis.crypto?.subtle)throw new Error('目前瀏覽器不支援安全密碼驗證，請使用新版瀏覽器或 HTTPS 開啟。');
 const bytes=new TextEncoder();
 const key=await crypto.subtle.importKey('raw',bytes.encode(password),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes.encode('darkmoon-local-admin-20261114'),iterations:210000,hash:'SHA-256'},key,256);
 const hex=Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('');
 return hex===VERIFY_HASH;
}

// Slow down guessing in this browser. This is a courtesy limit, not a server-side control.
const LOCK_KEY='darkmoon-local-admin-lock',FREE_TRIES=5;
const readLock=()=>{try{const v=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');if(v&&Number.isFinite(v.count)&&Number.isFinite(v.until))return v;}catch{}return {count:0,until:0};};
const lockRemaining=()=>Math.max(0,Math.ceil((readLock().until-Date.now())/1000));
function noteFailure(){const v=readLock();v.count+=1;v.until=v.count>=FREE_TRIES?Date.now()+Math.min(900,30*2**(v.count-FREE_TRIES))*1000:0;try{localStorage.setItem(LOCK_KEY,JSON.stringify(v));}catch{}return Math.max(0,FREE_TRIES-v.count);}
function clearFailures(){try{localStorage.removeItem(LOCK_KEY);}catch{}}

return {verifyLocalAdmin,lockRemaining,noteFailure,clearFailures};
})();
const scoringModule=(()=>{
// The scoring rules mirror the formulas in the supplied league workbook.
const FACTIONS = ['好人', '狼人', '第三方'];
const VIOLATIONS = ['無', '輕度', '中度', '重度'];
const DEFAULT_RULES = Object.freeze({
  baseScore: 1, winBonus: 1, mvpVoteBonus: 0.25,
  penalties: Object.freeze({ '無': 0, '輕度': 0.5, '中度': 1, '重度': 1.5 }),
  minimumGames: 6, dropHighest: 1,
  dropLowestBands: Object.freeze([
    Object.freeze({ min: 6, max: 10, count: 1 }),
    Object.freeze({ min: 11, max: 15, count: 2 }),
    Object.freeze({ min: 16, max: 20, count: 3 }),
    Object.freeze({ min: 21, max: null, count: 4 }),
  ]),
  ties: 'competition',
});

const present = value => typeof value === 'string' && value.trim().length > 0;
const sum = values => values.reduce((a, b) => a + b, 0);
const nearlyEqual = (a, b) => Math.abs(a - b) < 1e-10;

function isCompletedMatch(match) {
  return (match.status === undefined || match.status === 'completed') &&
    FACTIONS.includes(match.winner) && match.entries.some(entry => present(entry.playerId));
}

function scoreEntry(entry, match, rules = DEFAULT_RULES) {
  const base = entry.baseScore ?? rules.baseScore;
  const votes = entry.mvpVotes ?? 0;
  const violation = entry.violation || '無';
  const penalty = rules.penalties[violation];
  if (![base, votes, penalty, rules.winBonus, rules.mvpVoteBonus].every(Number.isFinite)) {
    throw new Error('計分欄位必須是有效數字，且違規程度必須有效。');
  }
  return base + (present(match.winner) && entry.faction === match.winner ? rules.winBonus : 0) +
    votes * rules.mvpVoteBonus - penalty;
}

function buildStandings(data) {
  const rules = data.rules || DEFAULT_RULES;
  const result = data.players.map(player => ({
    id: player.id, playerId: player.id, name: player.name, member: player.member,
    games: 0, total: 0, rawAverage: null, officialAverage: null,
    eligible: false, rank: null, wins: 0, mvpVotes: 0,
    dropHigh: 0, dropLow: 0, droppedHighTotal: null, droppedLowTotal: null,
    effectiveGames: null, scores: [],
  }));
  const byId = new Map(result.map(row => [row.playerId, row]));
  for (const match of data.matches) {
    if (!isCompletedMatch(match)) continue;
    for (const entry of match.entries) {
      if (!present(entry.playerId)) continue;
      const player = byId.get(entry.playerId);
      if (!player) throw new Error(`第 ${match.number} 場有未登錄的玩家。`);
      const won = entry.faction === match.winner;
      player.scores.push({
        matchId: match.id, number: match.number, board: match.board,
        seat: entry.seat, role: entry.role, faction: entry.faction,
        score: scoreEntry(entry, match, rules), won, mvpVotes: entry.mvpVotes ?? 0,
        dropped: null,
      });
    }
  }
  for (const player of result) {
    player.games = player.scores.length;
    player.total = sum(player.scores.map(s => s.score));
    player.rawAverage = player.games ? player.total / player.games : null;
    player.wins = player.scores.filter(s => s.won).length;
    player.mvpVotes = sum(player.scores.map(s => s.mvpVotes));
    player.eligible = player.member && player.games >= rules.minimumGames;
    if (!player.eligible) continue;
    player.dropHigh = rules.dropHighest;
    player.dropLow = rules.dropLowestBands.find(band =>
      player.games >= band.min && (band.max === null || player.games <= band.max))?.count ?? 0;
    const ordered = [...player.scores].sort((a, b) => a.score - b.score || a.number - b.number);
    const low = ordered.slice(0, player.dropLow);
    const high = player.dropHigh ? ordered.slice(-player.dropHigh) : [];
    low.forEach(score => { score.dropped = 'low'; });
    high.forEach(score => { score.dropped = 'high'; });
    player.droppedLowTotal = sum(low.map(score => score.score));
    player.droppedHighTotal = sum(high.map(score => score.score));
    const retained = ordered.filter(score => !score.dropped);
    player.effectiveGames = retained.length;
    player.officialAverage = retained.length ? sum(retained.map(score => score.score)) / retained.length : null;
  }
  result.sort((a, b) => {
    if (a.eligible !== b.eligible) return a.eligible ? -1 : 1;
    const aScore = a.eligible ? a.officialAverage : a.rawAverage;
    const bScore = b.eligible ? b.officialAverage : b.rawAverage;
    if (aScore === null && bScore !== null) return 1;
    if (bScore === null && aScore !== null) return -1;
    if (aScore !== null && bScore !== null && !nearlyEqual(aScore, bScore)) return bScore - aScore;
    return a.name.localeCompare(b.name, 'zh-Hant') || a.playerId.localeCompare(b.playerId);
  });
  let lastAverage = null;
  let lastRank = 0;
  let eligibleCount = 0;
  for (const player of result) {
    if (!player.eligible) continue;
    eligibleCount += 1;
    if (lastAverage === null || !nearlyEqual(player.officialAverage, lastAverage)) lastRank = eligibleCount;
    player.rank = lastRank;
    lastAverage = player.officialAverage;
  }
  return result;
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

function text(value, label, max = 100, allowEmpty = false) {
  assert(typeof value === 'string' && value.length <= max && (allowEmpty || value.trim().length > 0),
    `${label}必須是${allowEmpty ? '長度適當的' : '非空白'}文字（最多 ${max} 字）。`);
}

function number(value, label, min, max, integer = false) {

function renderOverview(){

}
function renderMe(){

function renderRules(){return header('計分規則','依原始試算表的實際計分公式建立。')+`<div class="rules-grid"><section class="panel form-panel"><h2>單場積分</h2><div class="formula">基本分 ＋ 勝方加分<br>＋ MVP 票數 × 0.25 − 違規扣分</div><p>基本分預設 1 分，可逐席調整。陣營與勝方一致加 1 分。MVP 票數＝玩家票＋上帝票，每票都加 0.25 分；保留原表的小數輸入。</p><div class="rule-line"><span>玩家 MVP 票</span><strong>每帳號每場 1～3 票，不能投自己</strong></div><div class="rule-line"><span>上帝 MVP 票</span><strong>每場 1～3 票，不公開，後台帶入成績</strong></div>${Object.entries(data.rules.penalties).map(([k,v])=>`<div class="rule-line"><span>${k==='無'?'無違規':k+'違規'}</span><strong>${v===0?'不扣分':'−'+v+' 分'}</strong></div>`).join('')}<div class="note-block note">對局使用 14 個 12 人局固定板型：角色只能從該板型配置中選，陣營依配置自動帶入（混血兒依所選榜樣自行選擇陣營）。不在固定板型裡的舊紀錄，陣營仍由記錄者設定。</div></section><section class="panel form-panel"><h2>正式獎品排名</h2><p>須為社員，且已完成至少 6 場。移除下列分數後，以剩餘分數平均排名。平均分完全相同時並列名次（例如 1、2、2、4），顯示四捨五入至小數點後 2 位，排序使用完整精度。</p><table><thead><tr><th>參賽場次</th><th>移除最高</th><th>移除最低</th></tr></thead><tbody>${data.rules.dropLowestBands.map(b=>`<tr><td>${b.max?b.min+'～'+b.max:b.min+' 場以上'}</td><td>1 場</td><td>${b.count} 場</td></tr>`).join('')}</tbody></table><div class="note-block note">0 分與負分仍是有效參賽。空白席位不計場次，草稿不列入統計。未達資格者可在「全部玩家」查看原始總分。</div></section></div><section class="panel form-panel settings-section"><h2>資料承接說明</h2><p style="margin-bottom:0">已保留 Excel 的玩家、24 個對局欄位與實際成績。原檔沒有日期，因此不補造比賽日期。原說明頁提到的「完成／SVP／30 席」與實際表格不一致，本網頁依實際 12 席和計分公式運作；原始說明保留於 JSON 備份的 sourceNotes。</p></section>`;}

async function commit(next,expected){
 if(!editable())throw new Error(mode==='cloud'?'目前無雲端寫入權限，或尚未恢復連線。':'目前正在儲存，請稍候。');
 if(expected!==version())throw new Error('資料已在其他視窗或裝置更新。請關閉後重新開啟，再套用這次修改。');
 validateLeague(next);busy=true;document.body.classList.add('busy');
 try{
  if(mode==='cloud'){const session=cloud;const r=await session.save(next,revision);if(cloud===session&&mode==='cloud'&&revision<=r){data=next;revision=r;}}
  else{const existing=JSON.parse(localStorage.getItem(KEY)||'null');if(existing&&existing.revision!==localRevision)throw new Error('另一個視窗已更新資料，請重新整理後再試。');const nextRevision=localRevision+1;localStorage.setItem(KEY,JSON.stringify({revision:nextRevision,data:next}));localRevision=nextRevision;localData=next;data=next;storageError='';}
 }finally{busy=false;document.body.classList.remove('busy');}
 render();
}

function onBoardChange(){

  let role=$('[data-field=role]',row).value,faction=$('[data-field=faction]',row).value;

function refreshBoard(){

 const name=$('#match-board').value,board=findBoard(name),rows=[...document.querySelectorAll('#match-form [data-seat]')];
 if(!board){box.innerHTML=`<p class="note">${name?'這是舊板子名稱，沒有固定配置；角色可自由輸入。':'請先選擇板子，角色會依該板型的固定配置帶入。'}</p>`;return;}

 rows.forEach(row=>{const sel=$('select[data-field=role]',row);if(!sel)return;[...sel.options].forEach(o=>{const slot=o.value&&boardSlot(board,o.value);if(!slot)return;const left=slot.count-(used[o.value]||0);o.textContent=slot.count>1&&sel.value!==o.value?`${o.value}（剩 ${Math.max(0,left)}）`:o.value;o.disabled=left<=0&&sel.value!==o.value;});});

// 儲存前檢查：角色必須在板型配置裡，且數量不超過配置。
function checkBoardRoles(m){
 const board=findBoard(m.board);if(!board)return;
 const used={};
 for(const e of m.entries){
  if(!e.role)continue;
  const slot=boardSlot(board,e.role);
  if(!slot)throw new Error(`${e.seat} 號的角色「${e.role}」不在「${board.name}」的配置裡，請重新選擇。`);
  used[e.role]=(used[e.role]||0)+1;
  if(used[e.role]>slot.count)throw new Error(`「${board.name}」只有 ${slot.count} 個${e.role}，目前分配了 ${used[e.role]} 個。`);
  if(slot.faction&&e.faction!==slot.faction)throw new Error(`${e.seat} 號${e.role}的陣營應為${slot.faction}。`);
 }
}
function pollGod(m){const g=m.god?data.players.find(p=>p.id===m.god):null;return {name:g?.name||'',uid:g?.accountUid||''};}
// 座位玩家的帳號對照（帳號 UID → 玩家），讓安全規則擋下「投給自己」。
function pollSeatUids(playerIds){const out={};playerIds.forEach(id=>{const uid=data.players.find(p=>p.id===id)?.accountUid;if(uid)out[uid]=id;});return out;}
const sameMap=(a,b)=>JSON.stringify(Object.entries(a||{}).sort())===JSON.stringify(Object.entries(b||{}).sort());
// 已開啟投票的場次：算出要同步到投票文件的欄位（板子、本場上帝、座位帳號對照）。
function pollChanges(poll,m){
 const patch={};if(m.board!==poll.board)patch.board=m.board;
 const god=pollGod(m);
 if((poll.godUid||'')!==god.uid){
  if(godBallotOf(poll))throw new Error('上帝已經投票，不能更換本場上帝。');
  if(god.uid&&poll.ballots.some(b=>b.uid===god.uid))throw new Error(`${god.name}已用自己的帳號投過玩家票，不能改為本場上帝。`);
  patch.godUid=god.uid;
 }
 const seats=pollSeatUids(poll.candidateIds);if(!sameMap(poll.seatUids,seats))patch.seatUids=seats;

function parseProvision(text,fallback){
 const byName=new Map(data.players.map(p=>[p.name.trim().normalize('NFKC').toLocaleLowerCase('zh-Hant'),p]));
 const rows=[],seenPlayers=new Set(),seenEmails=new Set();
 text.split(/\r?\n/).forEach((line,i)=>{
  if(!line.trim())return;
  const parts=line.split(/[,，\t]/).map(v=>v.trim()),[name,email='']=parts,password=parts.slice(2).join(',')||fallback;
  if(!email)return; // not filled in yet
  const at=`第 ${i+1} 行（${name||'未填姓名'}）`;
  const player=byName.get(name.normalize('NFKC').toLocaleLowerCase('zh-Hant'));
  if(!player)throw new Error(`${at}：玩家名單裡找不到這個姓名，請與名單完全一致。`);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error(`${at}：Email 格式不正確。`);
  if(!password||password.length<8)throw new Error(`${at}：沒有密碼或少於 8 個字元，請填預設密碼或在該行第三欄填密碼。`);
  if(seenPlayers.has(player.id))throw new Error(`${at}：同一位玩家出現兩次。`);
  if(seenEmails.has(email.toLowerCase()))throw new Error(`${at}：同一個 Email 出現兩次。`);
  seenPlayers.add(player.id);seenEmails.add(email.toLowerCase());rows.push({player,email,password});
 });
 if(!rows.length)throw new Error('請至少在一行填入 Email。');
 return rows;
}

   $('#provision-error').textContent='';
   const rows=parseProvision($('#provision-list').value,$('#provision-default').value),out=$('#provision-result'),next=copy(data),log=[];
   const taken=new Map(next.players.filter(p=>p.accountUid).map(p=>[p.accountUid,p]));let done=0;

     const result=await cloud.provision(row.email,row.password),owner=taken.get(result.uid),target=next.players.find(p=>p.id===row.player.id);
     if(owner&&owner.id!==target.id)throw new Error(`這個帳號已綁定給「${owner.name}」。`);
     target.accountUid=result.uid;if(accountsEnabled())(next.accounts??={})[target.id]={email:row.email,password:row.password};taken.set(result.uid,target);done+=1;
     log.push(`✓ ${row.player.name}：${result.created?'已建立帳號並綁定':'帳號已存在，已綁定'}`);
    }catch(error){log.push(`✗ ${row.player.name}：${error.message}`);}
   }
   if(done){await commit(next,editingVersion);editingVersion=version();editorDirty=false;}
   const failed=rows.length-done;
   if($('#provision-result'))$('#provision-result').textContent=`完成 ${done} 位${failed?`，${failed} 位失敗（修正後可再按一次，成功的不會重複建立）`:''}。\n`+log.join('\n');
   toast(failed?`已綁定 ${done} 位，${failed} 位失敗`:`已建立並綁定 ${done} 個帳號`,failed>0);
  }
  if(form.id==='account-register-form'){
   if(!cloud)throw new Error('尚未連接 Firebase，無法註冊。');
   const email=$('#register-email').value.trim(),password=$('#register-password').value;
   if(password!==$('#register-confirm').value)throw new Error('兩次輸入的密碼不一致。');
   await cloud.register(email,password);closeDialog(true);toast('註冊成功，已登入');
  }
  if(form.id==='account-login-form'){
 const username=$('#account-email').value.trim(),password=$('#account-password').value;
 if(username==='ntnuwsc'){
  const wait=lockRemaining();if(wait>0)throw new Error(`登入失敗次數過多，請 ${wait>=60?Math.ceil(wait/60)+' 分鐘':wait+' 秒'}後再試。`);
  if(!await verifyLocalAdmin(username,password)){const left=noteFailure();throw new Error(left>0?`帳號或密碼不正確，還可再試 ${left} 次。`:'帳號或密碼不正確，已暫時鎖定登入。');}
  clearFailures();
  ++connectionEpoch;await cloud?.disconnect();cloud=null;cloudUser=null;canEdit=false;cloudExists=false;cloudReady=false;polls=[];mode='local';data=localData;localAdmin=true;route='overview';
  closeDialog(true);render();toast('已登入本機管理者 ntnuwsc');
 }else{if(!cloud)throw new Error('請先完成 Firebase 連線設定，或使用本機管理帳號。');await cloud.login(username,password);closeDialog(true);toast('已登入，正在確認帳號權限');}
}
  if(form.id==='reset-form'){
   const id=form.dataset.id,clearSeats=!!$('#reset-seats')?.checked;
   if(!data.matches.some(x=>x.id===id))throw new Error('找不到這場對局。');
   if(!editable())throw new Error('目前無法編輯這場對局。');
   const hadPoll=polls.some(p=>p.id===id);
   if(hadPoll){
    if(mode!=='cloud'||!cloud)throw new Error('請先以 Firebase 管理者登入，才能刪除投票紀錄。');
    try{await cloud.voting.reset(id);}catch(error){if(/permission/i.test(error?.code||''))throw new Error('重設被拒絕：請管理者先到 Firebase 發布新版安全規則（支援重設對局）。');throw error;}
    voteDraft.delete(id);ballotLogOpen.delete(id);
   }
   const next=copy(data);const i=next.matches.findIndex(x=>x.id===id);next.matches[i]=resetMatchData(next.matches[i],clearSeats);
   await commit(next,editingVersion);closeDialog(true);toast(hadPoll?'已重設對局並刪除投票，設定好後可再按「開啟比賽」':'已重設對局，回到草稿');
  }
  if(form.id==='match-form'){
   const m=readMatch();checkBoardRoles(m);
   if(m.god&&m.entries.some(e=>e.playerId===m.god))throw new Error('本場上帝不能同時坐在座位上，請換一位上帝或調整座位。');

   closeDialog(true);toast(pollPatch?'對局已儲存，投票頁已同步更新':m.status==='completed'?'對局已儲存，排名已更新':'草稿已儲存');
  }
  if(form.id==='player-form'){
